<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="erpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#erpGrad)" filter="url(#shadow)" />

  <!-- Accent Corner Glow -->
  <circle cx="50" cy="14" r="6" fill="url(#accentGrad)" />

  <!-- Barcode / Warehouse Box Isometric Grid Lines -->
  <path d="M14 22 h36 M14 26 h10 M28 26 h22 M14 30 h36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.3" />

  <!-- ERP Central Lettering -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ERP</text>

  <!-- Industrial Tech Node Dot -->
  <circle cx="50" cy="14" r="3" fill="#ffffff" />
</svg>
